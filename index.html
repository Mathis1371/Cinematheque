<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Ma collection de Blu-ray, 4K et Steelbooks — catalogue local.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cinémathèque — Ma collection</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e5383b'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%230a0a0c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://media.themoviedb.org">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="header">
    <div class="wrap">
      <a class="logo" href="#/"><span class="logo-mark"></span><span>Ciné<b>mathèque</b></span></a>
      <nav class="nav no-sb" id="nav">
        <a href="#/" data-r="home">Accueil</a>
        <a href="#/collection" data-r="collection">Collection<span class="count" data-c="owned"></span></a>
        <a href="#/wishlist" data-r="wishlist">Wishlist<span class="count" data-c="wish"></span></a>
        <a href="#/prochainement" data-r="upcoming">Prochainement<span class="count" data-c="soon"></span></a>
        <a href="#/steelbooks" data-r="steelbooks">Steelbooks</a>
        <a href="#/stats" data-r="stats">Stats</a>
        <a href="#/bingo" data-r="bingo">Bingo</a>
      </nav>
      <div class="h-actions">
        <button class="search-trigger" id="openSearch" title="Rechercher (Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Rechercher un film, un acteur…</span><span class="kbd">Ctrl K</span>
        </button>
        <button class="icon-btn" id="openRandom" title="Que regarder ce soir ? (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="openAdd" title="Ajouter un film (N)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <a class="icon-btn" href="#/reglages" title="Données & réglages">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <div id="notice"></div>
  <main id="view"><div class="loading"><div class="spinner"></div></div></main>

  <footer class="footer">
    <div class="wrap">
      <span>Cinémathèque · <span id="footStats"></span></span>
      <span><kbd>Ctrl K</kbd> rechercher · <kbd>R</kbd> film au hasard · <kbd>N</kbd> ajouter · <kbd>←</kbd><kbd>→</kbd> naviguer dans une fiche</span>
    </div>
  </footer>

  <div class="toasts" id="toasts"></div>
  <button class="totop" id="totop" title="Haut de page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 15 6-6 6 6"/></svg></button>
  <input type="file" id="fileInput" accept="application/json,.json" hidden>

  <script src="assets/references.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/stats.js"></script>
</body>
</html>
